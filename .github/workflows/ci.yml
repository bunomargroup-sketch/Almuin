name: CI

on:
  push:
    branches: ["main", "arena/**", "fix/**", "ci/**"]
  pull_request:
    branches: ["main", "arena/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # app_localizations*.dart is gitignored, so it must be generated
      # before analysis or every `context.l10n` reference fails to resolve.
      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter expanded

  android-build:
    name: Android build (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Expected to fail until android/app/build.gradle.kts exists with core
    # library desugaring enabled (required by flutter_local_notifications).
    # Kept non-blocking so the failure stays visible without gating the PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build apk --debug
