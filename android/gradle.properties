org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Flutter plugins (flutter_timezone, flutter_tts, workmanager_android, ...) do
# not set a Kotlin jvmTarget, so they compile Kotlin to 1.8 while their Java
# targets 11. AGP treats that mismatch as an error. The combination is safe on
# Android — D8/R8 accepts both — so downgrade the check to a warning rather
# than patching every plugin's build file.
kotlin.jvm.target.validation.mode=warning
