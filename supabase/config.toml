# Almuin · Supabase project config
project_id = "almuin"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true
# Anonymous sign-ins let users save cloud progress without creating an
# account — enable when you want cloud sync (app works fine without it).
enable_anonymous_sign_ins = true

[functions.ai-assistant]
# Review S2: an open proxy would let anyone spend the OPENAI_API_KEY.
# The Flutter SDK sends the anon-key JWT automatically, so this is seamless.
verify_jwt = true

[functions.daily-content]
# Review S3: invoked via service-role JWT from cron; the function also
# hard-checks the caller role (or a CRON_SECRET) before doing any work.
verify_jwt = true
